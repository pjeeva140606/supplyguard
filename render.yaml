services:
  - type: web
    name: supplyguard-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python -m backend.data.generator && python -m backend.model.train
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /health
